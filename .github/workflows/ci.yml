name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: datalint_test
          POSTGRES_USER: datalint
          POSTGRES_PASSWORD: datalint-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datalint -d datalint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://datalint:datalint-test-password@127.0.0.1:5432/datalint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: datalint_e2e
          POSTGRES_USER: datalint
          POSTGRES_PASSWORD: datalint-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datalint -d datalint_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://datalint:datalint-test-password@127.0.0.1:5432/datalint_e2e
      DATALINT_USE_IN_MEMORY_DATABASE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
