services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datalint}
      POSTGRES_USER: ${POSTGRES_USER:-datalint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  datalint:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      PORT: "4100"
      DATABASE_URL: postgresql://${POSTGRES_USER:-datalint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datalint}
      MAX_UPLOAD_BYTES: "5242880"
      DATALINT_API_TOKEN: ${DATALINT_API_TOKEN:-}
      DATALINT_ALLOWED_ORIGINS: ${DATALINT_ALLOWED_ORIGINS:-http://localhost:4100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
